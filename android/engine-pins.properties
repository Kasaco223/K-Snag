#
# Archivos que el build baja, verifica por SHA-256 y mete en el APK (buildSrc/KdTasks.kt).
# Al cambiar uno, actualiza también su entrada en third_party/components.json y corre scripts/notices.py.

# yt-dlp que trae el APK (res/raw/ytdlp): el motor lo instala la primera vez, sin red. Después se actualiza
# solo. SHA-256 = línea "yt-dlp" de SHA2-256SUMS en el Release de yt-dlp-nightly-builds.
ytdlp.channel=nightly
ytdlp.version=2026.10.29.232701
ytdlp.url=https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/download/2026.10.29.232701/yt-dlp
ytdlp.sha256=966308057aa5f79ed09fead7609e46c8cf8fd89b23aeb2ef96989c6695a14724

# Certificados raíz de Mozilla (vía curl.se), en lugar del cert.pem de 2025-09-09 del paquete de Python.
# SHA-256 = https://curl.se/ca/cacert.pem.sha256 del mismo día.
cacert.date=2026-10-20
cacert.url=https://curl.se/ca/cacert-2026-10-20.pem
cacert.sha256=796f1389bfea13c0ed78f663b765baaff54a508e5483786bd6ece73c5e3e3cbe
